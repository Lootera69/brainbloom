<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassGlossDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="24%" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="52%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="74%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="30%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="specLight" cx="50%" cy="0%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="specDark" cx="50%" cy="0%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
    <filter id="glowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <style>
    #bg { fill: url(#bgGrad); }
    #glass { fill: url(#glassGloss); }
    #spec { fill: url(#specLight); }
    #edge { stroke: url(#edgeLight); }
    #sparkles { stroke: #ffffff; filter: url(#shadowLight); }
    @media (prefers-color-scheme: dark) {
      #bg { fill: #07070a; }
      #glass { fill: url(#glassGlossDark); }
      #spec { fill: url(#specDark); }
      #edge { stroke: url(#edgeDark); }
      #sparkles { stroke: #8b5cf6; filter: url(#glowDark); stroke-width: 5.2; }
    }
  </style>
  <rect id="bg" width="192" height="192" rx="40"/>
  <rect id="glass" width="192" height="192" rx="40"/>
  <ellipse id="spec" cx="96" cy="21" rx="87" ry="29"/>
  <rect id="edge" x="0.75" y="0.75" width="190.5" height="190.5" rx="39.25" fill="none" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="190.5" height="190.5" rx="39.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
  <g id="sparkles" transform="translate(96,96)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <path d="M0,-32 C4,-12 12,-4 32,0 C12,4 4,12 0,32 C-4,12 -12,4 -32,0 C-12,-4 -4,-12 0,-32Z"/>
    <path d="M38,-28 C40,-22 44,-20 48,-18 C44,-16 40,-14 38,-8 C36,-14 32,-16 28,-18 C32,-20 36,-22 38,-28Z"/>
    <path d="M-36,20 C-34,24 -32,26 -28,28 C-32,30 -34,32 -36,36 C-38,32 -40,30 -44,28 C-40,26 -38,24 -36,20Z"/>
  </g>
</svg>
