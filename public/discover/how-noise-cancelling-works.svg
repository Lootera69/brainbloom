<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Noise cancelling uses opposite sound waves</title><desc id="desc">A microphone measures incoming noise. Electronics create an opposite-phase wave through a speaker, reducing sound at the listener's ear.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fb7185"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fb7185"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fb7185;stroke-width:4;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".25" d="M0 0h1200v800H0z"/><text x="70" y="95" class="h">Silence by interference</text><text x="70" y="142" class="s">Measure noise → generate opposite phase → reduce the wave</text><path d="M85 400q25-100 50 0t50 0t50 0t50 0t50 0t50 0" fill="none" stroke="#fb7185" stroke-width="4"/><text x="90" y="550">Noise</text><path d="M370 400h80" class="f"/><circle cx="535" cy="400" r="90" fill="#152a43" stroke="#fb7185" stroke-width="3"/><path d="M500 400h70M535 365v70" stroke="#fb7185" stroke-width="5"/><text x="470" y="550">Mic + DSP</text><path d="M625 400h80" class="f"/><path d="M715 400q25 100 50 0t50 0t50 0t50 0t50 0t50 0" fill="none" stroke="#a78bfa" stroke-width="4"/><text x="760" y="550">Opposite phase</text><path d="M1010 400h80" class="f"/><circle cx="1130" cy="400" r="48" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><path d="M1105 375q50 25 0 50" fill="none" stroke="#67e8f9" stroke-width="5"/><text x="1065" y="550">Ear</text><rect x="350" y="650" width="500" height="72" rx="18" fill="#123b35" stroke="#34d399" stroke-width="3"/><text x="420" y="699">Smaller resulting pressure wave</text></svg>
