<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A refrigerator moves heat out</title><desc id="desc">Refrigerant circulates through an evaporator inside the cabinet, a compressor, an external condenser, and an expansion device.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#67e8f9"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#67e8f9;stroke-width:4;marker-end:url(#a)}.n{fill:#152a43;stroke:#67e8f9;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">A fridge moves heat, not cold</text><text x="70" y="142" class="s">Evaporate inside → compress → reject heat outside → expand</text><rect x="120" y="260" width="250" height="350" rx="20" class="n"/><path d="M145 400h200M145 430h200" stroke="#67e8f9" stroke-width="4"/><path d="M160 300v260M330 300v260" stroke="#67e8f9" stroke-width="2" stroke-dasharray="8 9"/><text x="168" y="650">Cold cabinet</text><circle cx="530" cy="430" r="105" fill="#152a43" stroke="#a78bfa" stroke-width="3"/><path d="M480 430q50-90 100 0t100 0" fill="none" stroke="#a78bfa" stroke-width="5"/><text x="480" y="590">Compressor</text><rect x="820" y="290" width="210" height="270" rx="18" fill="#3a2c13" stroke="#fbbf24" stroke-width="3"/><path d="M860 350h130M860 410h130M860 470h130" stroke="#fbbf24" stroke-width="6"/><text x="850" y="635">Condenser outside</text><path d="M370 350h85M635 350h185M925 560v100H245V610" class="f"/><path d="M1030 420h100" class="f"/><rect x="1060" y="350" width="50" height="140" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><text x="1010" y="720" class="s">Expansion valve</text></svg>
