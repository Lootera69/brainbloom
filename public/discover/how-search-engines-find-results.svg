<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Search: crawl, index, rank</title><desc id="desc">A search engine discovers pages with crawlers, stores their information in an index, and ranks useful matches for a query.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#67e8f9"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0h1200v800H0z"/><text x="70" y="95" class="h">From pages to useful results</text><text x="70" y="142" class="s">Crawl → index → interpret → rank</text><circle cx="180" cy="430" r="105" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><path d="M130 395h100M130 430h75M130 465h110" stroke="#e2f2ff" stroke-width="10"/><circle cx="215" cy="385" r="32" fill="#0b1325" stroke="#67e8f9" stroke-width="3"/><path d="M240 410l45 45" stroke="#67e8f9" stroke-width="10"/><text x="117" y="590">Crawl</text><path d="M305 430h120" class="f"/><rect x="455" y="285" width="245" height="290" rx="18" fill="#152a43" stroke="#a78bfa" stroke-width="3"/><text x="500" y="350">Index</text><path d="M500 405h150M500 450h150M500 495h110" stroke="#67e8f9" stroke-width="10"/><text x="485" y="635">Organised pages</text><path d="M720 430h120" class="f"/><rect x="870" y="290" width="240" height="110" rx="16" fill="#10273b" stroke="#fbbf24" stroke-width="3"/><text x="915" y="358">Query</text><path d="M990 400v85" class="f"/><rect x="870" y="505" width="240" height="110" rx="16" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><text x="900" y="573">Ranked matches</text><text x="390" y="747" class="s">The index makes search fast; ranking estimates usefulness.</text></svg>
