<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Corrections turn satellite measurements into a map location</title><desc id="desc">Atmospheric delay, satellite motion and receiver clock error are corrected before a coordinate is displayed on a street map.</desc>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a78bfa"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.head{font-size:44px;font-weight:700}.sub{font-size:25px;fill:#93b8d0}.line{fill:none;stroke:#a78bfa;stroke-width:3}.flow{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#a)}</style></defs>
<path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0h1200v800H0z"/><text x="70" y="95" class="head">Correct, then map</text><text x="70" y="142" class="sub">Position is a measurement. A map gives it context.</text>
<path d="M110 310Q280 200 440 310M110 335Q280 225 440 335" class="line"/><text x="117" y="392" class="sub">Atmospheric delay</text><path d="M280 295v170" class="flow"/>
<circle cx="160" cy="505" r="38" class="line"/><path d="M160 478v27l23 14M405 475q60 50 0 90" class="flow"/><text x="95" y="590" class="sub">Clock offset</text><text x="342" y="620" class="sub">Motion</text>
<rect x="515" y="350" width="210" height="175" rx="20" fill="#152a43" stroke="#a78bfa" stroke-width="3"/><text x="548" y="407">Corrected</text><text x="535" y="453">coordinate</text><text x="553" y="493" class="sub">lat / lon</text><path d="M310 480H505M440 500H505M735 438H810" class="flow"/>
<rect x="835" y="255" width="295" height="370" rx="18" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><path d="M875 260v360M1010 260v360M840 335h285M840 510h285" stroke="#315066" stroke-width="18"/><path d="M875 260v360M1010 260v360M840 335h285M840 510h285" stroke="#93b8d0" stroke-width="2" stroke-dasharray="9 9"/><path d="M1010 420c-58-65-40-100 0-100s58 35 0 100z" fill="#a78bfa"/><circle cx="1010" cy="353" r="12" fill="#0b1325"/><text x="880" y="690">Map location</text>
</svg>
