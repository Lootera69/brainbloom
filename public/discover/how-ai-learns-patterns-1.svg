<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Training data becomes numerical signals</title><desc id="desc">Text, images, and sound are transformed into structured numerical representations before entering a model.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fb7185"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fb7185;stroke-width:3;marker-end:url(#a)}.c{fill:#152a43;stroke:#fb7185;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Representations carry useful structure</text><text x="70" y="142" class="s">Different inputs become numbers a model can compare.</text><rect x="95" y="245" width="215" height="110" rx="16" class="c"/><text x="158" y="313">Text</text><rect x="95" y="395" width="215" height="110" rx="16" class="c"/><text x="155" y="463">Image</text><rect x="95" y="545" width="215" height="110" rx="16" class="c"/><text x="150" y="613">Sound</text><path d="M310 300h105M310 450h105M310 600h105" class="f"/><rect x="450" y="245" width="300" height="410" rx="20" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><text x="500" y="315">Numbers</text><text x="500" y="390">0.12</text><text x="500" y="450">−0.84</text><text x="500" y="510">0.37</text><text x="500" y="570">1.05</text><path d="M750 450h120" class="f"/><circle cx="1000" cy="450" r="130" fill="#152a43" stroke="#fb7185" stroke-width="3"/><circle cx="960" cy="410" r="12" fill="#67e8f9"/><circle cx="1040" cy="410" r="12" fill="#67e8f9"/><circle cx="960" cy="490" r="12" fill="#67e8f9"/><circle cx="1040" cy="490" r="12" fill="#67e8f9"/><path d="M960 410h80M960 490h80M960 410v80M1040 410v80" stroke="#67e8f9" stroke-width="3"/><text x="940" y="650">Model input</text></svg>
