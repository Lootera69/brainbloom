<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Antibiotics target bacteria, not viruses</title><desc id="desc">A comparison shows antibiotics can target bacterial machinery, while viruses use a host cell to reproduce.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fb7185"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Use the tool that matches the target</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Bacteria have their own machinery; viruses borrow ours.</text><rect x="100" y="245" width="430" height="390" rx="28" fill="#173c54" stroke="#34d399" stroke-width="4"/><text x="150" y="310" font-size="35" fill="#34d399">Bacterium</text><circle cx="300" cy="450" r="110" fill="#1d6b62" stroke="#34d399" stroke-width="4"/><circle cx="260" cy="415" r="20" fill="#fbbf24"/><circle cx="345" cy="475" r="20" fill="#fbbf24"/><text x="170" y="590" font-size="28">Own ribosomes + wall</text><path d="M555 440H645" stroke="#fb7185" stroke-width="7" marker-end="url(#a)"/><text x="565" y="385" font-size="27" fill="#fb7185">antibiotic</text><rect x="670" y="245" width="430" height="390" rx="28" fill="#173c54" stroke="#a78bfa" stroke-width="4"/><text x="720" y="310" font-size="35" fill="#a78bfa">Virus in a host cell</text><circle cx="875" cy="450" r="115" fill="#28405b" stroke="#7dd3fc" stroke-width="4"/><g fill="#fda4af"><circle cx="790" cy="400" r="25"/><circle cx="880" cy="460" r="25"/><circle cx="950" cy="400" r="25"/></g><text x="715" y="590" font-size="28">Uses host machinery</text><text x="600" y="735" text-anchor="middle" font-size="27" fill="#a9c3d8">A bacterial target is not automatically a viral target.</text></g></svg>
