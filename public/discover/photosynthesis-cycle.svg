<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">The Calvin cycle builds sugar</title><desc id="desc">Carbon dioxide enters the Calvin cycle. ATP and NADPH power carbon fixation and regeneration, producing sugar building blocks.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Build food from carbon dioxide</text><text x="70" y="142" font-size="27" fill="#a9c3d8">The Calvin cycle uses captured energy to turn carbon into sugar building blocks.</text><circle cx="600" cy="440" r="190" fill="#102e3a" stroke="#34d399" stroke-width="5"/><path d="M600 250Q820 250 790 440T600 630Q380 630 410 440T600 250" fill="none" stroke="#7dd3fc" stroke-width="8" marker-end="url(#a)"/><text x="600" y="450" text-anchor="middle" font-size="36" fill="#34d399">Calvin cycle</text><path d="M120 440H380" stroke="#7dd3fc" stroke-width="8" marker-end="url(#a)"/><text x="130" y="390" font-size="31" fill="#7dd3fc">CO₂ in</text><path d="M600 650V735" stroke="#34d399" stroke-width="8" marker-end="url(#a)"/><text x="630" y="735" font-size="30" fill="#34d399">sugar building blocks</text><path d="M850 300L1020 210M850 350L1050 350" stroke="#fbbf24" stroke-width="7" marker-end="url(#a)"/><text x="900" y="180" font-size="29" fill="#fbbf24">ATP + NADPH</text><text x="600" y="785" text-anchor="middle" font-size="24" fill="#a9c3d8">Sugars can fuel respiration, storage, and plant structure.</text></g></svg>
