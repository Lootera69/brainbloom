<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Bacteria have drug targets</title><desc id="desc">A bacterial cell contains structures such as a cell wall and ribosomes that some antibiotics disrupt.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fb7185"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Bacterial machinery offers targets</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Different antibiotics interfere with different bacterial structures.</text><circle cx="520" cy="440" r="180" fill="#1d6b62" stroke="#34d399" stroke-width="7"/><circle cx="520" cy="440" r="142" fill="none" stroke="#fbbf24" stroke-width="18"/><circle cx="460" cy="400" r="22" fill="#fbbf24"/><circle cx="570" cy="490" r="22" fill="#fbbf24"/><path d="M700 330H1030M700 440H1030M700 550H1030" stroke="#fb7185" stroke-width="6" marker-end="url(#a)"/><text x="745" y="315" font-size="29" fill="#fbbf24">Cell wall</text><text x="745" y="425" font-size="29" fill="#fbbf24">Ribosomes</text><text x="745" y="535" font-size="29" fill="#fbbf24">Chemical pathways</text><text x="335" y="690" font-size="30">Bacterial cell</text><text x="600" y="760" text-anchor="middle" font-size="26" fill="#a9c3d8">A drug can be selective when its target differs from human cells.</text></g></svg>
