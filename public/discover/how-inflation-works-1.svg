<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Inflation measures a broad basket</title><desc id="desc">An index tracks several categories, because one price changing alone is not the same as economy-wide inflation.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">One price is not the whole story</text><text x="70" y="142" font-size="27" fill="#a9c3d8">A broad basket helps reveal a sustained change in average prices.</text><g fill="#173c54" stroke="#7dd3fc" stroke-width="4"><rect x="120" y="280" width="220" height="150" rx="18"/><rect x="390" y="280" width="220" height="150" rx="18"/><rect x="660" y="280" width="220" height="150" rx="18"/><rect x="930" y="280" width="180" height="150" rx="18"/></g><text x="230" y="370" text-anchor="middle" font-size="30">Food</text><text x="500" y="370" text-anchor="middle" font-size="30">Housing</text><text x="770" y="370" text-anchor="middle" font-size="30">Transport</text><text x="1020" y="370" text-anchor="middle" font-size="30">Care</text><path d="M170 560H1040" stroke="#59788d" stroke-width="4"/><path d="M210 535L410 510 610 485 810 430 1010 390" fill="none" stroke="#fbbf24" stroke-width="8"/><text x="150" y="620" font-size="30">Index 100</text><text x="920" y="350" font-size="30" fill="#fbbf24">rising average</text><text x="600" y="735" text-anchor="middle" font-size="27" fill="#a9c3d8">The mix matters: economists track many goods and services together.</text></g></svg>
