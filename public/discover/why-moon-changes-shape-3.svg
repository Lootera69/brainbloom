<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Moon phases are not Earth's shadow</title><desc id="desc">Normal phases happen because the observer views different portions of the Moon's sunlit half. Earth's shadow is involved only during a lunar eclipse.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#a78bfa"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">A phase is not an eclipse</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Most nights, Earth is not casting a shadow on the Moon.</text><circle cx="190" cy="430" r="68" fill="#fbbf24"/><path d="M270 430H500" stroke="#fbbf24" stroke-width="9" marker-end="url(#a)"/><circle cx="650" cy="430" r="78" fill="#155b83" stroke="#7dd3fc" stroke-width="4"/><circle cx="880" cy="430" r="60" fill="#e5e7eb"/><path d="M820 430H940" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/><text x="130" y="570" font-size="29">Sun</text><text x="595" y="570" font-size="29">Earth</text><text x="820" y="570" font-size="29">Moon phase</text><path d="M730 430H800" stroke="#a78bfa" stroke-width="5"/><path d="M650 430L880 430" stroke="#fb7185" stroke-width="5" stroke-dasharray="12 12"/><text x="750" y="370" font-size="27" fill="#fb7185">shadow only in alignment</text><text x="600" y="700" text-anchor="middle" font-size="30" fill="#34d399">Lunar eclipse: Sun → Earth → Moon</text><text x="600" y="755" text-anchor="middle" font-size="26" fill="#a9c3d8">Everyday phases come from geometry; eclipses are special alignments.</text></g></svg>
