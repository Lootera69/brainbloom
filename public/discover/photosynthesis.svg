<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A leaf's tiny solar factory</title><desc id="desc">Sunlight, water, and carbon dioxide enter a leaf. The leaf makes sugar and releases oxygen.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">A leaf's tiny solar factory</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Sunlight powers a leaf to turn air and water into stored chemical energy.</text><circle cx="180" cy="300" r="72" fill="#fbbf24"/><path d="M250 300L405 365" stroke="#fbbf24" stroke-width="9" marker-end="url(#a)"/><path d="M530 560C350 490 355 270 570 250C820 230 900 440 650 570C610 590 570 580 530 560Z" fill="#145c4c" stroke="#34d399" stroke-width="5"/><path d="M550 540L665 280M550 540L410 400M550 540L760 410" stroke="#34d399" stroke-width="4"/><path d="M550 540V720" stroke="#34d399" stroke-width="12"/><path d="M600 360H850" stroke="#7dd3fc" stroke-width="8" marker-end="url(#a)"/><path d="M390 500H170" stroke="#7dd3fc" stroke-width="8" marker-end="url(#a)"/><text x="735" y="335" font-size="31" fill="#7dd3fc">CO₂ in</text><text x="180" y="475" font-size="31" fill="#7dd3fc">O₂ out</text><text x="470" y="750" font-size="31" fill="#7dd3fc">water up</text><text x="545" y="205" font-size="32" fill="#34d399">leaf cells</text><text x="600" y="790" text-anchor="middle" font-size="26" fill="#a9c3d8">Photosynthesis stores some sunlight energy in sugars.</text></g></svg>
