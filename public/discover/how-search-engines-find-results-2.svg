<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">An index organises known page information</title><desc id="desc">Words from several pages are mapped into an index so a query can retrieve candidate pages without rereading the whole web.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a78bfa"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.p{fill:#152a43;stroke:#a78bfa;stroke-width:3}.f{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">The index is a map of content</text><text x="70" y="142" class="s">Precomputed information avoids rereading every page.</text><rect x="90" y="260" width="260" height="330" rx="18" class="p"/><text x="150" y="330">Pages</text><text x="130" y="410">space</text><text x="130" y="460">river</text><text x="130" y="510">energy</text><path d="M385 420h110" class="f"/><rect x="540" y="230" width="360" height="400" rx="18" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><text x="615" y="305">Index</text><path d="M610 370h200M610 430h200M610 490h200M610 550h200" stroke="#67e8f9" stroke-width="12"/><text x="830" y="379">→ A, C</text><text x="830" y="439">→ B</text><text x="830" y="499">→ A, B</text><path d="M935 420h105" class="f"/><rect x="1060" y="350" width="90" height="140" rx="12" fill="#3a2c13" stroke="#fbbf24" stroke-width="3"/><path d="M1082 390h45M1082 425h45M1082 460h30" stroke="#fbbf24" stroke-width="6"/><text x="455" y="735" class="s">Word and page signals point to candidate documents.</text></svg>
