<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Generation and step-up transmission</title><desc id="desc">Mechanical motion turns a generator, then a transformer raises voltage so current can travel long distances with less heating loss.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fbbf24"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fbbf24;stroke-width:4;marker-end:url(#a)}.n{fill:#152a43;stroke:#fbbf24;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Raise voltage for the long journey</text><text x="70" y="142" class="s">High voltage reduces current for the same power transfer.</text><path d="M95 440h100" class="f"/><circle cx="265" cy="440" r="100" class="n"/><path d="M205 440q60-100 120 0t120 0" fill="none" stroke="#67e8f9" stroke-width="5"/><text x="220" y="600">Generator</text><path d="M365 440h100" class="f"/><circle cx="570" cy="440" r="105" class="n"/><path d="M515 385l110 110M625 385L515 495" stroke="#fbbf24" stroke-width="5"/><text x="483" y="600">Transformer</text><path d="M675 440h390" class="f"/><path d="M740 410l95 60 95-60 95 60" fill="none" stroke="#fbbf24" stroke-width="5"/><text x="760" y="350" class="s">High-voltage lines</text><rect x="140" y="680" width="920" height="70" rx="18" fill="#10273b" stroke="#23435b"/><text x="210" y="727">Less current → less resistive heating loss</text></svg>
