<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Sunset light travels farther through air</title><desc id="desc">At sunset, sunlight crosses a longer atmospheric path. Blue light scatters out of the direct beam, leaving more red and orange light.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fb7185"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">At sunset, the path is longer</text><text x="70" y="142" font-size="27" fill="#a9c3d8">More atmosphere scatters blue out of the direct beam before it reaches you.</text><path d="M80 600H1120" stroke="#fb7185" stroke-width="5"/><circle cx="220" cy="600" r="72" fill="#fb7185"/><path d="M290 540Q510 330 1060 560" fill="none" stroke="#f8fafc" stroke-width="9" marker-end="url(#a)"/><g fill="#7dd3fc"><circle cx="430" cy="480" r="12"/><circle cx="630" cy="410" r="12"/><circle cx="820" cy="455" r="12"/></g><path d="M430 480L350 350M630 410L700 280M820 455L900 330" stroke="#7dd3fc" stroke-width="5" marker-end="url(#a)"/><path d="M900 500L1080 540" stroke="#fb7185" stroke-width="11" marker-end="url(#a)"/><text x="365" y="300" font-size="30" fill="#7dd3fc">blue scattered away</text><text x="890" y="490" font-size="30" fill="#fb7185">red/orange direct beam</text><text x="600" y="735" text-anchor="middle" font-size="27" fill="#a9c3d8">Longer atmospheric path → stronger filtering of shorter wavelengths.</text></g></svg>
