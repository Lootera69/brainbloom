<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Noise cancelling has practical limits</title><desc id="desc">Active cancellation works best for predictable low-frequency sound. Passive seals block some high frequencies, while fit, timing and changing noise limit performance.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fb7185"/></pattern><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.bar{fill:#152a43;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".25" d="M0 0h1200v800H0z"/><text x="70" y="95" class="h">Cancellation is not perfect</text><text x="70" y="142" class="s">The best method depends on frequency, fit, timing and predictability.</text><text x="120" y="280">Low frequency</text><rect x="120" y="320" width="430" height="80" rx="18" class="bar" stroke="#34d399"/><rect x="120" y="320" width="340" height="80" rx="18" fill="#34d399"/><text x="145" y="372">Active control works well</text><text x="120" y="495">High frequency</text><rect x="120" y="535" width="430" height="80" rx="18" class="bar" stroke="#fbbf24"/><rect x="120" y="535" width="270" height="80" rx="18" fill="#fbbf24"/><text x="145" y="587" fill="#0b1325">Passive seal helps</text><rect x="670" y="240" width="390" height="390" rx="195" fill="#152a43" stroke="#fb7185" stroke-width="3"/><circle cx="865" cy="435" r="105" fill="#0b1325" stroke="#67e8f9" stroke-width="4"/><path d="M765 360q-55 75 0 150M965 360q55 75 0 150" fill="none" stroke="#fb7185" stroke-width="7"/><text x="758" y="705">Fit and timing matter</text><text x="90" y="735" class="s">Sudden, changing sounds are harder to predict and cancel.</text></svg>
