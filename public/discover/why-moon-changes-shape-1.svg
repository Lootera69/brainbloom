<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Sunlight illuminates half the Moon</title><desc id="desc">The Sun lights one hemisphere of the spherical Moon at all times, even when that bright half faces away from Earth.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fbbf24"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Half lit, always</text><text x="70" y="142" font-size="27" fill="#a9c3d8">A sphere has a day side and a night side, like Earth.</text><circle cx="165" cy="430" r="78" fill="#fbbf24"/><path d="M245 430H510" stroke="#fbbf24" stroke-width="10" marker-end="url(#a)"/><circle cx="710" cy="430" r="170" fill="#1f2937" stroke="#e5e7eb" stroke-width="5"/><path d="M710 260A170 170 0 0 1 710 600Z" fill="#e5e7eb"/><path d="M710 260V600" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/><text x="610" y="660" font-size="31" fill="#e5e7eb">sunlit half</text><text x="820" y="660" font-size="31" fill="#94a3b8">night half</text><text x="600" y="750" text-anchor="middle" font-size="27" fill="#a9c3d8">The phase is about which half faces the observer.</text></g></svg>
