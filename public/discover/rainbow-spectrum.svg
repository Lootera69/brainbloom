<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Internal reflection sends colours back out</title><desc id="desc">A primary rainbow ray refracts into a drop, reflects once inside, then refracts out with separated colours directed towards an observer.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fbbf24"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">One bounce, then a colour fan</text><text x="70" y="142" font-size="27" fill="#a9c3d8">A primary rainbow uses two refractions and one internal reflection.</text><circle cx="600" cy="430" r="220" fill="#173c54" fill-opacity=".8" stroke="#7dd3fc" stroke-width="5"/><path d="M100 280L470 350" stroke="#f8fafc" stroke-width="9" marker-end="url(#a)"/><path d="M470 350L710 520" stroke="#f8fafc" stroke-width="8"/><path d="M710 520L470 350" stroke="#fbbf24" stroke-width="8" marker-end="url(#a)"/><path d="M470 350L1010 210" stroke="#fb7185" stroke-width="8"/><path d="M470 350L1030 290" stroke="#fbbf24" stroke-width="8"/><path d="M470 350L1040 390" stroke="#7dd3fc" stroke-width="8"/><path d="M470 350L1010 490" stroke="#8b5cf6" stroke-width="8"/><text x="110" y="230" font-size="28">incoming sunlight</text><text x="640" y="570" font-size="28" fill="#fbbf24">internal reflection</text><text x="920" y="175" font-size="27" fill="#fb7185">red outside</text><text x="920" y="535" font-size="27" fill="#8b5cf6">violet inside</text><text x="600" y="750" text-anchor="middle" font-size="27" fill="#a9c3d8">At about 42°, many droplets send the primary rainbow colours to your eyes.</text></g></svg>
