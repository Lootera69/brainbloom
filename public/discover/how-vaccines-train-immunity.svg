<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Vaccines train immune memory</title><desc id="desc">A safe antigen clue is recognised by immune cells, leading to antibodies and memory cells that respond faster later.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">A safer rehearsal for immunity</text><text x="70" y="142" font-size="27" fill="#a9c3d8">A clue teaches recognition without requiring the full disease.</text><circle cx="185" cy="390" r="75" fill="#334155" stroke="#34d399" stroke-width="4"/><path d="M160 380l25-28 25 28-25 28z" fill="#fda4af"/><text x="100" y="535" font-size="29">Vaccine clue</text><path d="M260 390H395" stroke="#34d399" stroke-width="6" marker-end="url(#a)"/><circle cx="500" cy="390" r="88" fill="#173c54" stroke="#7dd3fc" stroke-width="4"/><circle cx="470" cy="360" r="13" fill="#34d399"/><circle cx="525" cy="420" r="13" fill="#34d399"/><text x="438" y="540" font-size="29">Immune cells</text><path d="M595 390H735M595 390L735 250" stroke="#34d399" stroke-width="6" marker-end="url(#a)"/><circle cx="825" cy="240" r="75" fill="#173c54" stroke="#fbbf24" stroke-width="4"/><text x="825" y="248" text-anchor="middle" font-size="29" fill="#fbbf24">Antibody</text><circle cx="825" cy="520" r="75" fill="#173c54" stroke="#a78bfa" stroke-width="4"/><path d="M790 495l35 25 35-25M825 520v38" fill="none" stroke="#a78bfa" stroke-width="7"/><text x="825" y="620" text-anchor="middle" font-size="29">Memory cell</text><path d="M900 520H1070" stroke="#a78bfa" stroke-width="6" marker-end="url(#a)"/><text x="1015" y="475" text-anchor="middle" font-size="27">Faster response</text><text x="600" y="735" text-anchor="middle" font-size="27" fill="#a9c3d8">Recognition → specialised defence → immune memory</text></g></svg>
