<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A home device completes a circuit</title><desc id="desc">A neighborhood transformer lowers voltage. Live and return conductors form a complete circuit through a lamp, which converts electrical energy into light and heat.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fbbf24"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fbbf24;stroke-width:4;marker-end:url(#a)}.n{fill:#152a43;stroke:#fbbf24;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Complete the local circuit</text><text x="70" y="142" class="s">Current flows around a loop when a device is connected safely.</text><circle cx="180" cy="405" r="95" class="n"/><path d="M130 350l100 110M230 350L130 460" stroke="#fbbf24" stroke-width="5"/><text x="120" y="570">Transformer</text><path d="M275 350H430M275 460H430" class="f"/><path d="M430 350v-100M430 250h440v100M430 460v100M430 560h440v-100" fill="none" stroke="#fbbf24" stroke-width="5"/><rect x="570" y="315" width="170" height="180" rx="18" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><path d="M610 410q45-100 90 0t90 0" fill="none" stroke="#fbbf24" stroke-width="5"/><text x="605" y="540">Lamp</text><path d="M450 250l-20 25M850 250l20 25M450 560l-20-25M850 560l20-25" class="f"/><text x="435" y="205" class="s">Live</text><text x="815" y="650" class="s">Return path</text><text x="170" y="725" class="s">Light + heat are energy conversions.</text></svg>
