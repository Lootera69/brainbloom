<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Ranking estimates which results help most</title><desc id="desc">A query retrieves candidate pages. Relevance, quality and freshness signals combine into a ranked list, with the top result only a prediction of usefulness.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#67e8f9"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Ranking blends many signals</text><text x="70" y="142" class="s">Relevance + quality + freshness → estimated usefulness</text><rect x="90" y="300" width="220" height="110" rx="16" fill="#3a2c13" stroke="#fbbf24" stroke-width="3"/><text x="150" y="368">Query</text><path d="M310 355h105" class="f"/><circle cx="535" cy="355" r="95" fill="#152a43" stroke="#a78bfa" stroke-width="3"/><text x="485" y="347">Signals</text><text x="477" y="383" class="s">match</text><path d="M630 355h105" class="f"/><path d="M790 255h300M790 375h240M790 495h180" stroke="#67e8f9" stroke-width="24"/><text x="760" y="270">1</text><text x="760" y="390">2</text><text x="760" y="510">3</text><text x="790" y="620" class="s">Ranked candidates</text><path d="M1050 255v300" stroke="#fbbf24" stroke-width="4"/><text x="910" y="700" class="s">Top ≠ guaranteed truth</text><text x="95" y="700" class="s">Systems predict what may help.</text></svg>
