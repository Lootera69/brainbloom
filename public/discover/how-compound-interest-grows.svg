<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Compound interest grows on earlier growth</title><desc id="desc">A balance rises in steps as each period's interest joins the principal before the next period.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Growth joins the base</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Each period earns interest on the balance built by earlier periods.</text><path d="M140 650V230M140 650H1080" stroke="#a9c3d8" stroke-width="4"/><path d="M180 580L360 520 540 450 720 345 900 250 1050 190" fill="none" stroke="#34d399" stroke-width="9"/><g fill="#fbbf24"><circle cx="180" cy="580" r="12"/><circle cx="360" cy="520" r="12"/><circle cx="540" cy="450" r="12"/><circle cx="720" cy="345" r="12"/><circle cx="900" cy="250" r="12"/></g><text x="160" y="705" font-size="28">Start</text><text x="340" y="705" font-size="28">Year 1</text><text x="520" y="705" font-size="28">Year 2</text><text x="700" y="705" font-size="28">Year 3</text><text x="880" y="705" font-size="28">Year 4</text><text x="900" y="220" font-size="30" fill="#34d399">interest on interest</text><text x="600" y="760" text-anchor="middle" font-size="27" fill="#a9c3d8">The curve accelerates because the base keeps getting larger.</text></g></svg>
