<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Electrons power a connected device</title><desc id="desc">When a circuit closes, electrons leave one electrode through a device and return to the other, while ions move through the electrolyte.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#34d399"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#34d399;stroke-width:4;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Two routes complete the circuit</text><text x="70" y="142" class="s">Electrons move in wire; ions balance charge inside.</text><rect x="130" y="340" width="150" height="180" rx="15" fill="#3a1825" stroke="#fb7185" stroke-width="3"/><text x="170" y="440">Anode</text><rect x="920" y="340" width="150" height="180" rx="15" fill="#123b35" stroke="#34d399" stroke-width="3"/><text x="953" y="440">Cathode</text><rect x="470" y="300" width="260" height="180" rx="20" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><path d="M515 390q85-110 170 0t170 0" fill="none" stroke="#fbbf24" stroke-width="5"/><text x="555" y="545">Device</text><path d="M280 350V210h640v130" class="f"/><text x="420" y="180">Electrons in external wire</text><path d="M280 510v155h640V510" class="f"/><text x="410" y="735">Ions through electrolyte</text><path d="M380 550l40 25M820 575l40-25" class="f"/></svg>
