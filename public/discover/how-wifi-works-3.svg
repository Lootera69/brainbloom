<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Packets are checked and reassembled</title><desc id="desc">A message is split into three numbered packets. A lost second packet is resent, and the receiver puts all three back in order.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#67e8f9"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.head{font-size:44px;font-weight:700}.sub{font-size:25px;fill:#93b8d0}.line{fill:none;stroke:#67e8f9;stroke-width:3;stroke-linejoin:round}.flow{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#a)}</style></defs>
<path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#grid)" opacity=".45" d="M0 0h1200v800H0z"/><text x="70" y="95" class="head">Small packets, one message</text><text x="70" y="142" class="sub">Check each piece. Resend what is missing.</text>
<text x="85" y="250">Split</text><text x="515" y="250">Transfer</text><text x="950" y="250">Reassemble</text>
<rect x="95" y="300" width="160" height="290" rx="14" class="line"/><path d="M95 396h160M95 492h160" class="line"/><text x="163" y="362">1</text><text x="163" y="458">2</text><text x="163" y="554">3</text>
<path d="M280 350H900M280 550H900" class="flow"/><rect x="525" y="320" width="110" height="60" rx="10" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><text x="571" y="361">1</text><rect x="640" y="520" width="110" height="60" rx="10" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><text x="687" y="561">3</text>
<path d="M280 450H495M650 450H900" class="line" stroke-dasharray="10 12"/><path d="M545 425l50 50M595 425l-50 50" stroke="#fb7185" stroke-width="4"/><text x="510" y="410" class="sub">Lost</text>
<path d="M280 600v80H840v-220h60" class="flow"/><rect x="485" y="650" width="175" height="60" rx="10" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><text x="507" y="691">Resend 2</text>
<rect x="935" y="300" width="160" height="290" rx="14" class="line"/><path d="M935 396h160M935 492h160" class="line"/><text x="1003" y="362">1</text><text x="1003" y="458">2</text><text x="1003" y="554">3</text><text x="930" y="665" class="sub">In order again</text>
</svg>
