<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Inflation raises the average price level</title><desc id="desc">A basket of everyday goods costs more over time as demand, supply, and costs interact, reducing purchasing power.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fbbf24"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Inflation: the basket gets pricier</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Broad, sustained price growth means money buys less than before.</text><rect x="145" y="360" width="270" height="185" rx="18" fill="#173c54" stroke="#7dd3fc" stroke-width="4"/><circle cx="220" cy="425" r="30" fill="#34d399"/><path d="M280 460l35-65 35 65z" fill="#fbbf24"/><text x="190" y="600" font-size="30">Year 1</text><text x="185" y="650" font-size="34" fill="#34d399">$100 basket</text><path d="M480 450H650" stroke="#fbbf24" stroke-width="7" marker-end="url(#a)"/><path d="M560 350V250" stroke="#fb7185" stroke-width="7" marker-end="url(#a)"/><text x="470" y="215" font-size="27" fill="#fb7185">prices rise</text><rect x="730" y="300" width="300" height="245" rx="18" fill="#173c54" stroke="#fb7185" stroke-width="4"/><circle cx="805" cy="400" r="30" fill="#34d399"/><path d="M865 465l35-65 35 65z" fill="#fbbf24"/><text x="790" y="600" font-size="30">Year 2</text><text x="785" y="650" font-size="34" fill="#fb7185">$110 basket</text><text x="600" y="745" text-anchor="middle" font-size="27" fill="#a9c3d8">Demand, supply, and production costs can all push prices upward.</text></g></svg>
