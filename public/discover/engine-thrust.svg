  <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#91b5c8"/><stop offset=".22" stop-color="#3a6177"/><stop offset=".5" stop-color="#173548"/><stop offset="1" stop-color="#4f788c"/></linearGradient>
