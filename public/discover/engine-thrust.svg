  <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b5d0df"/><stop offset=".45" stop-color="#5d8499"/><stop offset="1" stop-color="#1c3c51"/></linearGradient>
  <linearGradient id="heat" x1="0" x2="1"><stop stop-color="#fb9d69" stop-opacity=".08"/><stop offset=".4" stop-color="#ff754e"/><stop offset=".7" stop-color="#ffcb7a"/><stop offset="1" stop-color="#ff8457" stop-opacity=".06"/></linearGradient>
  <linearGradient id="jet" x1="0" x2="1"><stop stop-color="#66d8eb" stop-opacity=".02"/><stop offset=".2" stop-color="#8ce4ed" stop-opacity=".55"/><stop offset="1" stop-color="#8ce4ed" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b1e7f4" stroke-opacity=".045"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#79d9e9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
