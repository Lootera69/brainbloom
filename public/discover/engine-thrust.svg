<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Air back. Engine forward.</title><desc id="desc">The fan and engine core accelerate air backward. The reaction force pushes the engine and aircraft forward. In a high-bypass turbofan most thrust comes from bypass air.</desc>
<defs>
