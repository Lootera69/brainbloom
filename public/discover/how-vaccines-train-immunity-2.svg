<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Antibodies target the antigen</title><desc id="desc">B cells produce Y-shaped antibodies that fit the antigen pattern and help coordinate immune defence.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Build a targeted response</text><text x="70" y="142" font-size="27" fill="#a9c3d8">B cells make antibodies shaped to recognise the target.</text><circle cx="220" cy="430" r="125" fill="#173c54" stroke="#7dd3fc" stroke-width="4"/><path d="M170 480V400M170 400L125 355M170 400l45-45M270 480V400M270 400l-45-45M270 400l45-45" stroke="#fbbf24" stroke-width="13" fill="none"/><text x="125" y="610" font-size="30">B cell</text><path d="M360 430H505" stroke="#34d399" stroke-width="6" marker-end="url(#a)"/><path d="M670 315V475M670 315l-52-52M670 315l52-52" stroke="#fbbf24" stroke-width="14" fill="none"/><circle cx="670" cy="520" r="40" fill="#fda4af"/><text x="580" y="610" font-size="30">Antibody fit</text><path d="M790 430H920" stroke="#34d399" stroke-width="6" marker-end="url(#a)"/><g fill="#173c54" stroke="#34d399" stroke-width="4"><circle cx="1020" cy="350" r="38"/><circle cx="960" cy="450" r="38"/><circle cx="1040" cy="550" r="38"/></g><path d="M1020 350l45-25M960 450l45-25M1040 550l45-25" stroke="#fda4af" stroke-width="8"/><text x="920" y="650" font-size="30">Coordinated defence</text><text x="600" y="735" text-anchor="middle" font-size="27" fill="#a9c3d8">Antibodies are one part of a larger immune response.</text></g></svg>
