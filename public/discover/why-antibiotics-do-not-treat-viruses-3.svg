<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Unneeded antibiotics select resistance</title><desc id="desc">A population of bacteria includes rare resistant cells. Antibiotic pressure removes susceptible cells, leaving resistant cells to multiply.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fb7185"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Resistance is selection, not immunity</text><text x="70" y="142" font-size="27" fill="#a9c3d8">A rare resistant bacterium can become common after susceptible cells are removed.</text><text x="145" y="245" font-size="30">Before treatment</text><text x="680" y="245" font-size="30">After antibiotic pressure</text><g fill="#34d399"><circle cx="180" cy="350" r="23"/><circle cx="260" cy="420" r="23"/><circle cx="340" cy="330" r="23"/><circle cx="410" cy="470" r="23"/><circle cx="240" cy="540" r="23"/><circle cx="400" cy="560" r="23"/></g><g fill="#fbbf24"><circle cx="330" cy="520" r="25"/><circle cx="455" cy="360" r="25"/></g><path d="M545 420H645" stroke="#fb7185" stroke-width="7" marker-end="url(#a)"/><text x="545" y="350" font-size="27" fill="#fb7185">selection</text><g fill="#fbbf24"><circle cx="810" cy="360" r="28"/><circle cx="930" cy="450" r="28"/><circle cx="1030" cy="335" r="28"/><circle cx="1000" cy="545" r="28"/><circle cx="800" cy="550" r="28"/></g><path d="M850 300L1010 230M850 520L1020 610" stroke="#fbbf24" stroke-width="5" marker-end="url(#a)"/><text x="770" y="690" font-size="29" fill="#fbbf24">Resistant cells multiply</text><text x="600" y="760" text-anchor="middle" font-size="26" fill="#a9c3d8">Use antibiotics when a bacterial infection is diagnosed and treatment is appropriate.</text></g></svg>
