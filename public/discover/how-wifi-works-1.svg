<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Digital bits become a radio pattern</title><desc id="desc">A sequence of bits controls changes in a radio wave. An antenna emits the modulated signal through the room.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#67e8f9"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.head{font-size:44px;font-weight:700}.sub{font-size:25px;fill:#93b8d0}.line{fill:none;stroke:#67e8f9;stroke-width:4;stroke-linecap:round}.flow{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#a)}</style></defs>
<path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#grid)" opacity=".45" d="M0 0h1200v800H0z"/><text x="70" y="95" class="head">Turn bits into radio</text><text x="70" y="142" class="sub">Information changes the wave's pattern.</text>
<text x="110" y="255">Digital bits</text><text x="100" y="355" font-size="48" letter-spacing="25">1 0 1 1</text><path d="M100 425h60v-50h55v50h55v-50h110" class="line"/><path d="M425 380H515" class="flow"/>
<text x="570" y="255">Modulation</text><path d="M530 380H930" stroke="#23435b" stroke-width="2"/><path d="M530 380q15-80 30 0t30 0t30 0t30 0q15 80 30 0t30 0t30 0t30 0q15-80 30 0t30 0t30 0t30 0" class="line"/><path d="M650 300V470M770 300V470" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 8"/><text x="560" y="535" class="sub">Timed changes carry bits</text>
<path d="M940 390H995" class="flow"/><path d="M1020 475V350l-35-55M1020 350l35-55M990 475h60" class="line"/><path d="M1065 325q40 60 0 120M1095 300q65 85 0 170" class="line" opacity=".65"/><text x="965" y="535" class="sub">Antenna</text>
<rect x="100" y="625" width="990" height="90" rx="20" fill="#10273b" stroke="#23435b"/><text x="140" y="681">Chosen frequency</text><path d="M465 670h140" class="flow"/><text x="650" y="681">Radio signal through air</text>
</svg>
