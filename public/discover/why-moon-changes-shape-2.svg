<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">The observer sees a changing fraction</title><desc id="desc">At different positions in its orbit, the Moon's illuminated half presents new, quarter, or full views to an observer on Earth.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Your viewpoint selects the phase</text><text x="70" y="142" font-size="27" fill="#a9c3d8">The same lit half looks different from Earth as the Moon moves around us.</text><circle cx="600" cy="440" r="70" fill="#155b83" stroke="#7dd3fc" stroke-width="4"/><text x="600" y="450" text-anchor="middle" font-size="27">Earth</text><circle cx="600" cy="440" r="240" fill="none" stroke="#59788d" stroke-width="3" stroke-dasharray="9 12"/><g fill="#e5e7eb" stroke="#fbbf24" stroke-width="3"><circle cx="360" cy="440" r="42"/><circle cx="600" cy="200" r="42"/><circle cx="840" cy="440" r="42"/></g><path d="M360 440A42 42 0 0 1 360 524Z" fill="#fbbf24"/><path d="M558 200A42 42 0 0 1 642 200Z" fill="#fbbf24"/><path d="M798 440A42 42 0 0 0 882 440Z" fill="#fbbf24"/><text x="320" y="560" font-size="28">crescent</text><text x="550" y="125" font-size="28">quarter</text><text x="800" y="560" font-size="28">full</text><path d="M150 700H1030" stroke="#fbbf24" stroke-width="5"/><text x="600" y="755" text-anchor="middle" font-size="27" fill="#a9c3d8">Orbit changes the viewing angle, not the Moon's actual shape.</text></g></svg>
