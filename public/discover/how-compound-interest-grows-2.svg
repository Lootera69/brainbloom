<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Interest stays in the account</title><desc id="desc">A balance is separated into original principal and accumulated interest, then the interest becomes part of the next base.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Leave the growth in place</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Compounding happens when earned interest stays invested.</text><rect x="150" y="315" width="360" height="230" rx="22" fill="#173c54" stroke="#7dd3fc" stroke-width="4"/><rect x="190" y="365" width="280" height="115" rx="12" fill="#155b83"/><text x="330" y="435" text-anchor="middle" font-size="34">$1,000 base</text><path d="M550 430H690" stroke="#34d399" stroke-width="7" marker-end="url(#a)"/><rect x="730" y="315" width="320" height="230" rx="22" fill="#173c54" stroke="#34d399" stroke-width="4"/><rect x="770" y="365" width="200" height="70" rx="12" fill="#155b83"/><rect x="770" y="435" width="200" height="45" rx="12" fill="#34d399"/><text x="870" y="410" text-anchor="middle" font-size="29">$1,000</text><text x="870" y="468" text-anchor="middle" font-size="25" fill="#081522">interest added</text><path d="M870 575V660" stroke="#34d399" stroke-width="7" marker-end="url(#a)"/><text x="870" y="715" text-anchor="middle" font-size="29">Next period's base</text><text x="600" y="760" text-anchor="middle" font-size="26" fill="#a9c3d8">Withdrawals and fees reduce the balance that can compound.</text></g></svg>
