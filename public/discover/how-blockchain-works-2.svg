<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Hashes reveal changed history</title><desc id="desc">A block's contents produce a short fingerprint. Editing one record changes the fingerprint and breaks the link to the next block.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a78bfa"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.b{fill:#152a43;stroke:#a78bfa;stroke-width:3}.f{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0h1200v800H0z"/><text x="70" y="95" class="h">A hash fingerprints a block</text><text x="70" y="142" class="s">Same input → same fingerprint. Changed input → changed fingerprint.</text><rect x="100" y="275" width="280" height="300" rx="18" class="b"/><text x="155" y="345">Block 02</text><path d="M150 390h180M150 440h120M150 490h150" stroke="#67e8f9" stroke-width="12"/><path d="M405 425h120" class="f"/><rect x="555" y="325" width="200" height="200" rx="100" fill="#10273b" stroke="#67e8f9" stroke-width="4"/><text x="615" y="420">HASH</text><path d="M780 425h110" class="f"/><rect x="920" y="275" width="180" height="300" rx="18" class="b"/><text x="958" y="345">Block 03</text><text x="947" y="425" class="s">Prev hash</text><rect x="100" y="645" width="1000" height="85" rx="18" fill="#3a1825" stroke="#fb7185" stroke-width="3"/><text x="155" y="701">Edit one record → fingerprint changes → link breaks</text></svg>
