<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Earth's tilt creates the seasons</title><desc id="desc">Two Earths on opposite sides of the Sun keep parallel tilted axes. The Northern Hemisphere has summer in June and winter in December.</desc>
<defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258" stroke-width="1"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#fbbf24"/></marker></defs>
<rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#grid)" opacity=".4"/>
<g font-family="Arial, sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Seasons follow Earth's tilt</text><text x="70" y="140" font-size="27" fill="#a9c3d8">The axis keeps pointing in nearly the same direction.</text>
<ellipse cx="600" cy="422" rx="390" ry="170" fill="none" stroke="#59788d" stroke-width="3" stroke-dasharray="10 12"/>
<circle cx="600" cy="422" r="88" fill="#fbbf24"/><text x="600" y="434" text-anchor="middle" font-size="34" fill="#081522">Sun</text>
<path d="M493 395H345M705 450H855" stroke="#fbbf24" stroke-width="5" marker-end="url(#a)"/>
<circle cx="235" cy="422" r="90" fill="#155b83" stroke="#7dd3fc" stroke-width="3"/><path d="M235 332A90 90 0 0 1 235 512Z" fill="#fbbf24" opacity=".3"/>
<circle cx="965" cy="422" r="90" fill="#155b83" stroke="#7dd3fc" stroke-width="3"/><path d="M965 332A90 90 0 0 0 965 512Z" fill="#fbbf24" opacity=".3"/>
<path d="M180 549L290 295M910 549L1020 295" stroke="#edf6ff" stroke-width="5"/><text x="295" y="289" font-size="28">N</text><text x="1024" y="289" font-size="28">N</text>
<text x="235" y="590" text-anchor="middle" font-size="32" fill="#fbbf24">June</text><text x="235" y="632" text-anchor="middle" font-size="26">North: summer</text><text x="235" y="670" text-anchor="middle" font-size="26">South: winter</text>
<text x="965" y="590" text-anchor="middle" font-size="32" fill="#7dd3fc">December</text><text x="965" y="632" text-anchor="middle" font-size="26">North: winter</text><text x="965" y="670" text-anchor="middle" font-size="26">South: summer</text>
<text x="600" y="747" text-anchor="middle" font-size="27" fill="#a9c3d8">23.5° tilt → changing light angle + changing day length</text></g></svg>
