<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">AI learns patterns through feedback</title><desc id="desc">Examples become numerical inputs, a model predicts, feedback measures error, and adjusted weights improve later predictions.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fb7185"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fb7185;stroke-width:3;marker-end:url(#a)}.n{fill:#152a43;stroke:#fb7185;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Examples shape a model</text><text x="70" y="142" class="s">Input → prediction → error signal → updated weights</text><rect x="80" y="330" width="205" height="150" rx="18" class="n"/><text x="125" y="395">Examples</text><text x="130" y="435" class="s">numbers</text><path d="M285 405h95" class="f"/><circle cx="500" cy="405" r="120" class="n"/><circle cx="465" cy="370" r="12" fill="#67e8f9"/><circle cx="535" cy="370" r="12" fill="#67e8f9"/><circle cx="465" cy="440" r="12" fill="#67e8f9"/><circle cx="535" cy="440" r="12" fill="#67e8f9"/><path d="M465 370l70 70M535 370l-70 70" stroke="#67e8f9" stroke-width="3"/><text x="433" y="595">Model</text><path d="M620 405h105" class="f"/><rect x="745" y="330" width="180" height="150" rx="18" class="n"/><text x="780" y="395">Prediction</text><text x="795" y="435" class="s">output</text><path d="M925 405h100" class="f"/><rect x="1045" y="330" width="90" height="150" rx="18" fill="#3a1825" stroke="#fb7185" stroke-width="3"/><text x="1060" y="395">Error</text><path d="M1090 500v100H500v-70" class="f"/><text x="690" y="665" class="s">Feedback adjusts weights and the cycle repeats.</text></svg>
