<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">GPS combines satellite timing signals</title><desc id="desc">Four satellites send one-way timing signals to a receiver on Earth. Their known positions and signal travel times determine position and receiver clock error.</desc>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a78bfa"/></marker><g id="sat" fill="#152a43" stroke="#a78bfa" stroke-width="3"><rect x="-28" y="-28" width="56" height="56" rx="7"/><path d="M-90-20h50v40h-50zM40-20h50v40H40zM0-28v-25M-15-53h30"/></g><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.head{font-size:44px;font-weight:700}.sub{font-size:25px;fill:#93b8d0}.flow{fill:none;stroke:#a78bfa;stroke-width:3;stroke-dasharray:9 9;marker-end:url(#a)}</style></defs>
<path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0h1200v800H0z"/><text x="70" y="95" class="head">Position from precise clocks</text><text x="70" y="142" class="sub">Known satellite positions + signal travel times</text>
<use href="#sat" x="160" y="325"/><use href="#sat" x="445" y="245"/><use href="#sat" x="765" y="245"/><use href="#sat" x="1040" y="325"/>
<path d="M180 355L575 565M450 280L590 555M755 280L610 555M1020 355L630 565" class="flow"/>
<path d="M70 715Q600 405 1130 715" fill="#10273b" stroke="#67e8f9" stroke-width="4"/><path d="M565 625v-60a35 35 0 0 1 70 0v60z" fill="#0b1325" stroke="#e2f2ff" stroke-width="3"/><circle cx="600" cy="585" r="10" fill="#a78bfa"/><text x="710" y="636">Receiver</text><text x="420" y="705">Position + clock offset</text><text x="292" y="762" class="sub">Typically 4+ satellites for a 3D fix and clock correction</text>
</svg>
