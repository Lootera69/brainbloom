<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A microphone measures incoming noise</title><desc id="desc">A microphone converts changing air pressure from a sound wave into an electrical signal for processing.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fb7185"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fb7185"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fb7185;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".25" d="M0 0h1200v800H0z"/><text x="70" y="95" class="h">Measure the pressure changes</text><text x="70" y="142" class="s">A microphone samples noise before cancellation.</text><path d="M95 410q25-115 50 0t50 0t50 0t50 0t50 0t50 0t50 0" fill="none" stroke="#fb7185" stroke-width="5"/><text x="105" y="555">Air pressure</text><path d="M390 410h100" class="f"/><circle cx="605" cy="410" r="125" fill="#152a43" stroke="#fb7185" stroke-width="3"/><circle cx="605" cy="410" r="42" fill="none" stroke="#fb7185" stroke-width="5"/><path d="M605 368v84M563 410h84" stroke="#fb7185" stroke-width="4"/><text x="535" y="600">Microphone</text><path d="M730 410h100" class="f"/><rect x="850" y="330" width="250" height="160" rx="18" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><text x="900" y="400">Digital</text><text x="895" y="445">signal</text><path d="M880 520l50-40 40 20 60-60 55 25" fill="none" stroke="#67e8f9" stroke-width="4"/><text x="370" y="730" class="s">Sampling gives the controller a moving estimate of the noise.</text></svg>
