<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Moon phases are changing views of sunlight</title><desc id="desc">The Moon always has one sunlit half. As it orbits Earth, observers see different fractions of that half.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fbbf24"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">The Moon's shape is a changing view</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Sunlight always illuminates half of the Moon; our angle changes.</text><circle cx="600" cy="430" r="75" fill="#fbbf24"/><text x="600" y="442" text-anchor="middle" font-size="30" fill="#081522">Sun</text><circle cx="600" cy="430" r="230" fill="none" stroke="#59788d" stroke-width="3" stroke-dasharray="9 12"/><circle cx="370" cy="430" r="42" fill="#e5e7eb"/><circle cx="830" cy="430" r="42" fill="#e5e7eb"/><circle cx="600" cy="200" r="42" fill="#e5e7eb"/><circle cx="600" cy="660" r="42" fill="#e5e7eb"/><path d="M370 388A42 42 0 0 1 370 472Z" fill="#fbbf24"/><path d="M788 430A42 42 0 0 0 872 430Z" fill="#fbbf24"/><path d="M600 158A42 42 0 0 1 600 242Z" fill="#fbbf24"/><path d="M558 660A42 42 0 0 0 642 660Z" fill="#fbbf24"/><text x="302" y="530" font-size="25">new</text><text x="780" y="530" font-size="25">full</text><text x="545" y="120" font-size="25">quarter</text><text x="525" y="735" font-size="25">quarter</text></g></svg>
