<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Opposite seasons repeat each year</title><desc id="desc">A yearly timeline compares the Northern and Southern Hemispheres. June summer in the north is winter in the south, and December reverses this.</desc>
<defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a9c3d8"/></marker></defs>
<rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#grid)" opacity=".4"/>
<g font-family="Arial, sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Six months later, the roles reverse</text><text x="70" y="145" font-size="27" fill="#a9c3d8">The two hemispheres share an orbit, but have opposite seasons.</text>
<path d="M180 490H1100M180 655H1100" stroke="#59788d" stroke-width="3" marker-end="url(#a)"/>
<path d="M230 400Q450 150 660 400T1090 400" fill="none" stroke="#fbbf24" stroke-width="7"/><path d="M230 575Q450 825 660 575T1090 575" fill="none" stroke="#7dd3fc" stroke-width="7"/>
<g fill="#edf6ff" font-size="27"><text x="200" y="255">March</text><text x="405" y="255">June</text><text x="622" y="255">September</text><text x="955" y="255">December</text></g>
<text x="70" y="410" font-size="30" fill="#fbbf24">North</text><text x="70" y="587" font-size="30" fill="#7dd3fc">South</text><text x="382" y="340" font-size="29" fill="#fbbf24">Summer</text><text x="944" y="475" font-size="29" fill="#fbbf24">Winter</text><text x="402" y="695" font-size="29" fill="#7dd3fc">Winter</text><text x="944" y="557" font-size="29" fill="#7dd3fc">Summer</text>
<text x="600" y="759" text-anchor="middle" font-size="26" fill="#a9c3d8">Illustrative seasonal warmth: tilt matters more than Earth–Sun distance.</text></g></svg>
