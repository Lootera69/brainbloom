<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Substations control and lower grid voltage</title><desc id="desc">Transmission lines enter a substation, where switches and transformers route power and lower its voltage in stages toward neighborhoods.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fbbf24"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fbbf24;stroke-width:4;marker-end:url(#a)}.n{fill:#152a43;stroke:#fbbf24;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Switch, protect, step down</text><text x="70" y="142" class="s">The grid balances changing demand and isolates faults.</text><path d="M90 360h150" class="f"/><path d="M130 330v-90M190 330v-90M130 240h60" class="f"/><text x="90" y="450">Transmission</text><rect x="300" y="250" width="470" height="300" rx="24" fill="#10273b" stroke="#fbbf24" stroke-width="3"/><text x="450" y="320">Substation</text><path d="M380 390h300M380 470h300" stroke="#fbbf24" stroke-width="5"/><circle cx="465" cy="390" r="14" fill="#fb7185"/><circle cx="600" cy="390" r="14" fill="#67e8f9"/><path d="M465 390v80M600 390v80" stroke="#fbbf24" stroke-width="4"/><text x="385" y="520" class="s">Switches + protection</text><path d="M770 400h120" class="f"/><circle cx="990" cy="400" r="100" class="n"/><path d="M935 345l110 110M1045 345L935 455" stroke="#fbbf24" stroke-width="5"/><text x="920" y="570">Step down</text><path d="M1090 400h75" class="f"/><text x="70" y="700" class="s">Voltage drops in stages as power moves closer to users.</text></svg>
