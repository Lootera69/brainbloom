<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Why the sky is blue</title><desc id="desc">Sunlight enters the atmosphere. Air molecules scatter shorter blue wavelengths more strongly than longer red wavelengths.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#7dd3fc"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">The atmosphere scatters blue light</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Short wavelengths scatter more strongly, filling the daytime sky with blue light.</text><circle cx="165" cy="425" r="75" fill="#fbbf24"/><path d="M250 425H890" stroke="#f8fafc" stroke-width="9" marker-end="url(#a)"/><text x="255" y="365" font-size="28">sunlight</text><g fill="#7dd3fc"><circle cx="430" cy="400" r="12"/><circle cx="565" cy="470" r="12"/><circle cx="690" cy="390" r="12"/><circle cx="790" cy="500" r="12"/></g><path d="M430 400L370 295M430 400L350 510M565 470L620 350M690 390L780 285M690 390L790 420M790 500L900 620" stroke="#7dd3fc" stroke-width="5" marker-end="url(#a)"/><path d="M400 445H820" stroke="#fb7185" stroke-width="4" stroke-dasharray="18 14"/><text x="375" y="690" font-size="30" fill="#7dd3fc">blue scatters widely</text><text x="760" y="690" font-size="30" fill="#fb7185">red travels straighter</text><text x="600" y="760" text-anchor="middle" font-size="27" fill="#a9c3d8">The sky is not blue because the air contains blue dye.</text></g></svg>
