<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Time bends compound growth upward</title><desc id="desc">Two curves compare simple interest, which grows in a line, with compound interest, which accelerates as interest earns interest.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Time reveals the curve</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Compounding is modest at first, then increasingly separates from simple growth.</text><path d="M150 650V220M150 650H1080" stroke="#a9c3d8" stroke-width="4"/><path d="M180 600L1030 290" stroke="#fbbf24" stroke-width="7"/><path d="M180 600Q430 570 620 500T850 360T1030 210" fill="none" stroke="#34d399" stroke-width="9"/><text x="820" y="300" font-size="30" fill="#34d399">compound</text><text x="870" y="330" font-size="30" fill="#fbbf24">simple</text><text x="180" y="705" font-size="28">Start</text><text x="900" y="705" font-size="28">Time →</text><text x="600" y="760" text-anchor="middle" font-size="26" fill="#a9c3d8">The same mathematics can accelerate debt as well as savings.</text></g></svg>
