<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Sunlight contains a spectrum</title><desc id="desc">White sunlight can be separated into a continuous visible spectrum from violet and blue to red.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Sunlight carries many wavelengths</text><text x="70" y="142" font-size="27" fill="#a9c3d8">White light is a blend; the atmosphere sorts it by how strongly it scatters.</text><circle cx="180" cy="410" r="72" fill="#fbbf24"/><path d="M265 410H480" stroke="#f8fafc" stroke-width="12"/><path d="M500 260L700 410 500 560Z" fill="#173c54" stroke="#7dd3fc" stroke-width="4"/><path d="M700 410H1060" stroke-width="12" stroke="#f8fafc"/><path d="M700 410L1050 300" stroke="#8b5cf6" stroke-width="10"/><path d="M700 410L1060 350" stroke="#3b82f6" stroke-width="10"/><path d="M700 410L1070 400" stroke="#22d3ee" stroke-width="10"/><path d="M700 410L1070 460" stroke="#34d399" stroke-width="10"/><path d="M700 410L1060 515" stroke="#fbbf24" stroke-width="10"/><path d="M700 410L1050 570" stroke="#fb7185" stroke-width="10"/><text x="410" y="640" font-size="31">prism: wavelength separation</text><text x="780" y="270" font-size="27" fill="#8b5cf6">violet</text><text x="1000" y="605" font-size="27" fill="#fb7185">red</text><text x="600" y="745" text-anchor="middle" font-size="26" fill="#a9c3d8">Blue and violet wavelengths are shorter than red wavelengths.</text></g></svg>
