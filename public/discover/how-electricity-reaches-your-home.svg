<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Electricity travels through a changing-voltage grid</title><desc id="desc">A generator sends power through a step-up transformer, high-voltage lines, substations, and a neighborhood transformer to a home.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fbbf24"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fbbf24;stroke-width:5;marker-end:url(#a)}.n{fill:#152a43;stroke:#fbbf24;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">From generator to socket</text><text x="70" y="142" class="s">Voltage rises for travel, then falls near the home.</text><circle cx="135" cy="420" r="80" class="n"/><path d="M95 420q40-80 80 0t80 0" fill="none" stroke="#fbbf24" stroke-width="5"/><text x="75" y="570">Generator</text><path d="M215 420h90" class="f"/><rect x="315" y="350" width="140" height="140" rx="70" class="n"/><path d="M350 385l70 70M420 385l-70 70" stroke="#fbbf24" stroke-width="4"/><text x="294" y="570">Step up</text><path d="M455 420H700" class="f"/><path d="M500 400l70 40 70-40 70 40" fill="none" stroke="#fbbf24" stroke-width="5"/><text x="500" y="335" class="s">High voltage</text><path d="M705 420h80" class="f"/><rect x="800" y="340" width="130" height="160" rx="15" class="n"/><path d="M835 375l60 90M895 375l-60 90" stroke="#fbbf24" stroke-width="4"/><text x="777" y="570">Substation</text><path d="M930 420h90" class="f"/><path d="M1030 420v-70M1030 350h90v70M1000 420v70M1060 420v70" class="f"/><path d="M985 510h90v110h-90z" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><text x="980" y="680">Home</text><text x="310" y="755" class="s">Transformers change voltage; the grid routes power.</text></svg>
