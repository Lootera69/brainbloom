<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A battery separates chemical roles</title><desc id="desc">Anode, separator, electrolyte and cathode keep chemical reactions apart while allowing ions to cross internally.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#34d399"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#34d399;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Inside the cell: roles stay separate</text><text x="70" y="142" class="s">The separator blocks a direct short while ions can pass.</text><rect x="150" y="260" width="190" height="300" rx="15" fill="#3a1825" stroke="#fb7185" stroke-width="3"/><text x="195" y="335">Anode</text><text x="190" y="460" class="s">reaction</text><rect x="420" y="260" width="130" height="300" rx="15" fill="#26364a" stroke="#fbbf24" stroke-width="3" stroke-dasharray="9 9"/><text x="443" y="335">Separator</text><text x="447" y="460" class="s">barrier</text><rect x="630" y="260" width="190" height="300" rx="15" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><text x="661" y="335">Electrolyte</text><text x="680" y="460" class="s">ions</text><rect x="900" y="260" width="190" height="300" rx="15" fill="#123b35" stroke="#34d399" stroke-width="3"/><text x="943" y="335">Cathode</text><text x="940" y="460" class="s">reaction</text><path d="M550 420h75" class="f"/><path d="M430 600h120" stroke="#fb7185" stroke-width="5"/><path d="M650 600h120" stroke="#34d399" stroke-width="5"/><text x="340" y="700" class="s">Separated reactions create a voltage between electrodes.</text></svg>
