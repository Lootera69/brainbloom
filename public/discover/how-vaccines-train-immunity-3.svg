<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Memory makes a later response faster</title><desc id="desc">A first exposure takes time to build antibodies. A later exposure triggers a faster, higher response because memory cells remain.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Memory changes the next encounter</text><text x="70" y="142" font-size="27" fill="#a9c3d8">The first response is slow; immune memory helps the second response start sooner.</text><path d="M160 650V230M160 650H1080" stroke="#a9c3d8" stroke-width="4"/><path d="M180 625Q310 610 370 570T510 365Q575 310 640 535T820 430Q900 225 1050 265" fill="none" stroke="#fda4af" stroke-width="7"/><path d="M180 625Q320 620 380 550T480 285Q520 220 580 290T680 320Q770 305 820 245T1050 210" fill="none" stroke="#34d399" stroke-width="7"/><path d="M390 650V250M820 650V190" stroke="#59788d" stroke-width="3" stroke-dasharray="8 8"/><text x="240" y="700" font-size="28" fill="#fda4af">First exposure</text><text x="720" y="700" font-size="28" fill="#34d399">Later exposure</text><text x="180" y="205" font-size="28">Antibody level</text><text x="475" y="245" font-size="26" fill="#fda4af">slow build</text><text x="835" y="180" font-size="26" fill="#34d399">faster, stronger</text><text x="600" y="760" text-anchor="middle" font-size="26" fill="#a9c3d8">Memory cells remain after the rehearsal.</text></g></svg>
