<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Transactions are collected into a candidate block</title><desc id="desc">Three proposed records enter a pool and are grouped into one candidate block with a reference to the previous block.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a78bfa"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.r{fill:#10273b;stroke:#67e8f9;stroke-width:3}.f{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0h1200v800H0z"/><text x="70" y="95" class="h">Collect proposed records</text><text x="70" y="142" class="s">A block is a batch, not a single coin.</text><rect x="110" y="270" width="260" height="100" rx="15" class="r"/><text x="155" y="333">Record A</text><rect x="110" y="420" width="260" height="100" rx="15" class="r"/><text x="155" y="483">Record B</text><rect x="110" y="570" width="260" height="100" rx="15" class="r"/><text x="155" y="633">Record C</text><path d="M390 320h115M390 470h115M390 620h115" class="f"/><rect x="550" y="255" width="470" height="430" rx="22" fill="#152a43" stroke="#a78bfa" stroke-width="3"/><text x="625" y="330">Candidate block</text><path d="M625 390h300M625 455h300M625 520h300" stroke="#67e8f9" stroke-width="10"/><text x="625" y="605" class="s">previous block reference</text><path d="M1020 470h95" class="f"/><rect x="1120" y="390" width="45" height="160" rx="10" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><text x="165" y="750" class="s">Network participants receive the same proposals.</text></svg>
