<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Evaporation absorbs heat on the cold side</title><desc id="desc">Low-pressure refrigerant evaporates in coils inside the cabinet, absorbing heat from the food compartment.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#67e8f9"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#67e8f9;stroke-width:4;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Evaporation makes the inside cold</text><text x="70" y="142" class="s">The refrigerant absorbs heat as it changes from liquid to vapour.</text><rect x="130" y="250" width="430" height="360" rx="20" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><path d="M180 330h330v180H180z" fill="none" stroke="#67e8f9" stroke-width="4"/><path d="M205 380q30-70 60 0t60 0t60 0t60 0t60 0" fill="none" stroke="#a78bfa" stroke-width="6"/><text x="230" y="570">Evaporator coils</text><path d="M210 290l-40-40M300 290l-40-40M390 290l-40-40M480 290l-40-40" class="f"/><text x="185" y="205">Heat from food</text><path d="M560 430h140" class="f"/><circle cx="790" cy="430" r="105" fill="#152a43" stroke="#a78bfa" stroke-width="3"/><text x="735" y="420">Vapour</text><text x="746" y="460" class="s">low pressure</text><path d="M895 430h180" class="f"/><text x="820" y="700" class="s">Cold refrigerant leaves the evaporator.</text></svg>
