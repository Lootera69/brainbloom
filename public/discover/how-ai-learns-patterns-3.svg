<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Inference applies learned patterns to new input</title><desc id="desc">A trained model receives new input and produces a likely output. Similar inputs may generalise well, while unfamiliar inputs can be unreliable.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fb7185"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fb7185;stroke-width:3;marker-end:url(#a)}.n{fill:#152a43;stroke:#fb7185;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Inference makes a new prediction</text><text x="70" y="142" class="s">Learned patterns help most when new input resembles training examples.</text><rect x="100" y="330" width="230" height="160" rx="18" class="n"/><text x="155" y="400">New input</text><text x="165" y="445" class="s">numbers</text><path d="M330 410h120" class="f"/><circle cx="600" cy="410" r="145" class="n"/><circle cx="550" cy="360" r="12" fill="#67e8f9"/><circle cx="650" cy="360" r="12" fill="#67e8f9"/><circle cx="550" cy="460" r="12" fill="#67e8f9"/><circle cx="650" cy="460" r="12" fill="#67e8f9"/><path d="M550 360h100M550 460h100M550 360v100M650 360v100" stroke="#67e8f9" stroke-width="3"/><text x="528" y="625">Trained model</text><path d="M745 410h120" class="f"/><rect x="885" y="310" width="230" height="200" rx="18" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><text x="930" y="380">Likely output</text><text x="930" y="435" class="s">prediction</text><path d="M170 650h315" stroke="#67e8f9" stroke-width="20"/><path d="M715 650h315" stroke="#fb7185" stroke-width="20"/><text x="100" y="710" class="s">Familiar pattern: useful</text><text x="720" y="710" class="s">Unfamiliar pattern: uncertain</text></svg>
