<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Viruses reproduce inside host cells</title><desc id="desc">A virus enters a host cell, releases genetic instructions, and uses the cell's machinery to make copies.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#a78bfa"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">A virus borrows a host cell</text><text x="70" y="142" font-size="27" fill="#a9c3d8">It carries instructions but relies on the cell's machinery to copy them.</text><circle cx="220" cy="430" r="115" fill="#173c54" stroke="#7dd3fc" stroke-width="5"/><circle cx="220" cy="430" r="35" fill="#fda4af"/><path d="M300 350L425 425" stroke="#a78bfa" stroke-width="7" marker-end="url(#a)"/><text x="110" y="610" font-size="29">Virus enters</text><rect x="470" y="245" width="490" height="390" rx="180" fill="#28405b" stroke="#7dd3fc" stroke-width="5"/><path d="M590 440q80-100 160 0t160 0" fill="none" stroke="#fda4af" stroke-width="12"/><circle cx="650" cy="350" r="18" fill="#fbbf24"/><circle cx="780" cy="520" r="18" fill="#fbbf24"/><path d="M870 340L1040 250M900 440L1080 440M870 540L1040 630" stroke="#a78bfa" stroke-width="6" marker-end="url(#a)"/><text x="585" y="710" font-size="29">Host cell makes copies</text><text x="600" y="760" text-anchor="middle" font-size="26" fill="#a9c3d8">The viral target is entangled with the host's own machinery.</text></g></svg>
