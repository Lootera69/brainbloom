<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Consensus updates many copies</title><desc id="desc">Several network computers compare a candidate block, follow a consensus rule, and update their local copies to the agreed chain.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a78bfa"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.n{fill:#152a43;stroke:#67e8f9;stroke-width:3}.f{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Agreement across the network</text><text x="70" y="142" class="s">Rules select one candidate block as the next shared version.</text><rect x="485" y="290" width="230" height="165" rx="20" fill="#3a2c13" stroke="#fbbf24" stroke-width="3"/><text x="530" y="360">Candidate</text><text x="538" y="408">Block 04</text><circle cx="200" cy="300" r="85" class="n"/><circle cx="1000" cy="300" r="85" class="n"/><circle cx="260" cy="610" r="85" class="n"/><circle cx="940" cy="610" r="85" class="n"/><text x="158" y="310">Node A</text><text x="958" y="310">Node B</text><text x="218" y="620">Node C</text><text x="898" y="620">Node D</text><path d="M280 330L485 365M920 330L715 365M320 570L500 430M880 570L700 430" class="f"/><path d="M280 300Q600 120 920 300" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="10 10"/><path d="M280 620Q600 760 920 620" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="10 10"/><text x="440" y="745" class="s">Copies update after agreement</text></svg>
