<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Multiple distance measurements intersect</title><desc id="desc">Three distance circles in a simplified two-dimensional sketch intersect at a receiver position. Actual GPS uses distance spheres and solves receiver clock error.</desc>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><clipPath id="area"><rect x="200" y="210" width="800" height="520"/></clipPath><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.head{font-size:44px;font-weight:700}.sub{font-size:25px;fill:#93b8d0}</style></defs>
<path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0h1200v800H0z"/><text x="70" y="95" class="head">Distances narrow the possibilities</text><text x="70" y="142" class="sub">Trilateration uses distances, not angles.</text>
<g clip-path="url(#area)" stroke-width="3"><circle cx="440" cy="420" r="200" fill="#a78bfa" fill-opacity=".05" stroke="#a78bfa"/><circle cx="760" cy="420" r="200" fill="#67e8f9" fill-opacity=".05" stroke="#67e8f9"/><circle cx="600" cy="330" r="210" fill="#fbbf24" fill-opacity=".04" stroke="#fbbf24"/><path d="M440 420L600 540M760 420L600 540M600 330V540" fill="none" stroke="#e2f2ff" stroke-dasharray="8 8"/></g>
<circle cx="440" cy="420" r="10" fill="#a78bfa"/><circle cx="760" cy="420" r="10" fill="#67e8f9"/><circle cx="600" cy="330" r="10" fill="#fbbf24"/><text x="365" y="390">A</text><text x="780" y="390">B</text><text x="625" y="315">C</text>
<circle cx="600" cy="540" r="25" fill="#0b1325" stroke="#e2f2ff" stroke-width="4"/><circle cx="600" cy="540" r="9" fill="#e2f2ff"/><path d="M625 553L820 665" fill="none" stroke="#e2f2ff" stroke-width="2"/><text x="810" y="705">One shared point</text><text x="95" y="710" class="sub">2D sketch</text><text x="200" y="767" class="sub">Real GPS: 3D spheres + receiver clock correction</text>
</svg>
