<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Light reactions capture energy</title><desc id="desc">In a chloroplast, light energises electrons, water is split, oxygen leaves, and ATP and NADPH carry chemical energy onward.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Light becomes chemical energy</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Thylakoid membranes use light to move electrons and build energy carriers.</text><rect x="110" y="245" width="900" height="310" rx="30" fill="#102e3a" stroke="#34d399" stroke-width="5"/><circle cx="245" cy="400" r="56" fill="#fbbf24"/><circle cx="480" cy="400" r="56" fill="#fbbf24"/><path d="M300 400H425M535 400H710" stroke="#34d399" stroke-width="7" marker-end="url(#a)"/><path d="M230 345L230 275" stroke="#fbbf24" stroke-width="8" marker-end="url(#a)"/><text x="195" y="220" font-size="29" fill="#fbbf24">light</text><path d="M150 580H940" stroke="#7dd3fc" stroke-width="5"/><text x="180" y="635" font-size="29">H₂O</text><path d="M240 580H400" stroke="#7dd3fc" stroke-width="7" marker-end="url(#a)"/><text x="420" y="635" font-size="29" fill="#7dd3fc">O₂ released</text><path d="M710 400H980" stroke="#34d399" stroke-width="7" marker-end="url(#a)"/><text x="745" y="350" font-size="29" fill="#34d399">ATP + NADPH</text><text x="600" y="735" text-anchor="middle" font-size="27" fill="#a9c3d8">Oxygen comes from splitting water; energy carriers feed the next stage.</text></g></svg>
