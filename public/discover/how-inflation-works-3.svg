<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Interest rates can cool inflation</title><desc id="desc">A central bank raises interest rates, borrowing slows, demand cools, and price growth may slow with a delay.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Policy works through the economy</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Higher rates can cool borrowing and demand, but effects take time.</text><rect x="100" y="300" width="230" height="160" rx="20" fill="#173c54" stroke="#fbbf24" stroke-width="4"/><text x="215" y="380" text-anchor="middle" font-size="30">Central bank</text><path d="M350 380H470" stroke="#fbbf24" stroke-width="7" marker-end="url(#a)"/><rect x="500" y="300" width="230" height="160" rx="20" fill="#173c54" stroke="#7dd3fc" stroke-width="4"/><text x="615" y="360" text-anchor="middle" font-size="28">Interest</text><text x="615" y="402" text-anchor="middle" font-size="28" fill="#fb7185">rates ↑</text><path d="M750 380H870" stroke="#34d399" stroke-width="7" marker-end="url(#a)"/><rect x="900" y="300" width="210" height="160" rx="20" fill="#173c54" stroke="#34d399" stroke-width="4"/><text x="1005" y="360" text-anchor="middle" font-size="28">Borrowing</text><text x="1005" y="402" text-anchor="middle" font-size="28" fill="#34d399">slows</text><path d="M1000 510Q800 670 510 550T180 570" fill="none" stroke="#34d399" stroke-width="7" marker-end="url(#a)"/><text x="370" y="650" font-size="30" fill="#34d399">Demand cools → price growth slows</text><text x="600" y="745" text-anchor="middle" font-size="27" fill="#a9c3d8">The goal is stable price growth, while balancing jobs and investment.</text></g></svg>
