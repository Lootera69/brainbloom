<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Compression enables external heat release</title><desc id="desc">The compressor squeezes low-pressure vapour into a hot, high-pressure vapour that flows through outside condenser coils and releases heat.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fbbf24"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fbbf24;stroke-width:4;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Compress, then release heat</text><text x="70" y="142" class="s">Pressure and temperature rise before the condenser rejects heat.</text><circle cx="220" cy="430" r="110" fill="#152a43" stroke="#a78bfa" stroke-width="3"/><text x="165" y="420">Vapour</text><text x="171" y="460" class="s">low P</text><path d="M330 430h120" class="f"/><rect x="470" y="305" width="230" height="250" rx="20" fill="#3a2c13" stroke="#fbbf24" stroke-width="3"/><path d="M520 365h130M520 430h130M520 495h130" stroke="#fbbf24" stroke-width="8"/><text x="510" y="620">Compressor</text><path d="M700 430h120" class="f"/><rect x="840" y="260" width="220" height="340" rx="18" fill="#3a2c13" stroke="#fbbf24" stroke-width="3"/><path d="M880 335h140M880 410h140M880 485h140" stroke="#fbbf24" stroke-width="7"/><text x="858" y="665">Condenser coils</text><path d="M910 300l-30-70M990 300l30-70M910 600l-30 70M990 600l30 70" class="f"/><text x="415" y="735" class="s">Heat leaves to the room around the fridge.</text></svg>
