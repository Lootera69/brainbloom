<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">An antigen gives the immune system a clue</title><desc id="desc">A vaccine introduces a harmless antigen pattern; immune cells inspect it and begin a response.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Show a recognisable clue</text><text x="70" y="142" font-size="27" fill="#a9c3d8">The antigen is a target pattern, not the whole dangerous infection.</text><path d="M135 380C135 310 245 310 245 380V535H135Z" fill="#334155" stroke="#34d399" stroke-width="4"/><path d="M190 310V245" stroke="#34d399" stroke-width="8"/><circle cx="190" cy="212" r="32" fill="#fda4af"/><text x="105" y="605" font-size="29">Vaccine delivery</text><path d="M285 390H410" stroke="#34d399" stroke-width="6" marker-end="url(#a)"/><circle cx="565" cy="410" r="130" fill="#173c54" stroke="#7dd3fc" stroke-width="4"/><path d="M475 375q45-100 90 0t90 0" fill="none" stroke="#fda4af" stroke-width="12"/><circle cx="520" cy="490" r="20" fill="#34d399"/><circle cx="610" cy="490" r="20" fill="#34d399"/><text x="465" y="605" font-size="29">Antigen pattern</text><path d="M710 410H850" stroke="#34d399" stroke-width="6" marker-end="url(#a)"/><g fill="#173c54" stroke="#a78bfa" stroke-width="4"><circle cx="955" cy="350" r="52"/><circle cx="1035" cy="450" r="52"/><circle cx="955" cy="550" r="52"/></g><path d="M925 350h60M1005 450h60M925 550h60" stroke="#fbbf24" stroke-width="10"/><text x="875" y="660" font-size="29">Immune inspection</text><text x="600" y="735" text-anchor="middle" font-size="27" fill="#a9c3d8">The immune system learns what to recognise.</text></g></svg>
