<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Batteries store energy in chemical separation</title><desc id="desc">Two electrodes and an electrolyte create a voltage. Electrons travel through an external circuit while ions move internally.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#34d399"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#34d399;stroke-width:4;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Chemical energy becomes current</text><text x="70" y="142" class="s">Electrons use the outside route; ions move inside.</text><rect x="210" y="250" width="180" height="350" rx="18" fill="#3a1825" stroke="#fb7185" stroke-width="3"/><text x="267" y="330">Anode</text><text x="260" y="550" class="s">−</text><rect x="510" y="250" width="180" height="350" rx="18" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><text x="557" y="330">Electrolyte</text><text x="565" y="550" class="s">ions</text><rect x="810" y="250" width="180" height="350" rx="18" fill="#123b35" stroke="#34d399" stroke-width="3"/><text x="855" y="330">Cathode</text><text x="862" y="550" class="s">+</text><path d="M390 280h420M990 280v-100H210v100" class="f"/><text x="500" y="180">Electrons through device</text><path d="M405 570h90M705 570h90" class="f"/><text x="430" y="670" class="s">Ions through electrolyte</text><text x="320" y="745" class="s">Voltage difference = chemical opportunity</text></svg>
