<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Crawlers discover linked pages</title><desc id="desc">A crawler starts at a known page, follows links to other pages, and collects text and page structure for discovery.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#67e8f9"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.p{fill:#152a43;stroke:#67e8f9;stroke-width:3}.f{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Crawlers follow the web's links</text><text x="70" y="142" class="s">A page can exist online without being in an index.</text><rect x="90" y="325" width="210" height="180" rx="18" class="p"/><text x="145" y="390">Page A</text><path d="M135 430h120M135 465h90" stroke="#e2f2ff" stroke-width="9"/><rect x="495" y="220" width="210" height="180" rx="18" class="p"/><text x="550" y="285">Page B</text><path d="M540 325h120M540 360h90" stroke="#e2f2ff" stroke-width="9"/><rect x="495" y="520" width="210" height="180" rx="18" class="p"/><text x="550" y="585">Page C</text><path d="M540 625h120M540 660h90" stroke="#e2f2ff" stroke-width="9"/><rect x="900" y="350" width="200" height="150" rx="75" fill="#10273b" stroke="#fbbf24" stroke-width="3"/><circle cx="970" cy="420" r="37" fill="none" stroke="#fbbf24" stroke-width="8"/><path d="M998 448l42 42" stroke="#fbbf24" stroke-width="10"/><text x="944" y="570">Crawler</text><path d="M300 370L490 300M300 455l190 125M705 300l190 100M705 610l190-110M700 400L900 400" class="f"/><text x="85" y="625" class="s">Links</text><text x="870" y="700" class="s">Collect content + structure</text></svg>
