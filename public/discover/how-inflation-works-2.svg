<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Demand and costs can push prices</title><desc id="desc">Two simplified paths to rising prices: demand outpaces supply, or input costs rise and shift supply upward.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fbbf24"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Two routes to rising prices</text><text x="70" y="142" font-size="27" fill="#a9c3d8">More buyers or higher costs can move the market price.</text><text x="150" y="250" font-size="32" fill="#34d399">Demand outruns supply</text><path d="M170 600V300M170 600H530" stroke="#a9c3d8" stroke-width="4"/><path d="M210 550L480 330" stroke="#34d399" stroke-width="6"/><path d="M210 350L480 555" stroke="#7dd3fc" stroke-width="6"/><path d="M360 430V365" stroke="#fbbf24" stroke-width="6" marker-end="url(#a)"/><text x="250" y="650" font-size="27">quantity</text><text x="190" y="320" font-size="27">price ↑</text><text x="670" y="250" font-size="32" fill="#fb7185">Input costs rise</text><path d="M690 600V300M690 600H1080" stroke="#a9c3d8" stroke-width="4"/><path d="M735 550L1040 340" stroke="#fb7185" stroke-width="6"/><path d="M735 365L1040 575" stroke="#7dd3fc" stroke-width="6"/><path d="M900 430V370" stroke="#fbbf24" stroke-width="6" marker-end="url(#a)"/><text x="740" y="650" font-size="27">cost shock shifts supply</text><text x="600" y="745" text-anchor="middle" font-size="26" fill="#a9c3d8">Real economies combine many forces at once.</text></g></svg>
