<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Expansion completes the refrigeration loop</title><desc id="desc">After condensing to liquid, refrigerant passes through an expansion valve. Pressure drops, the fluid cools, and it returns to the evaporator.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#67e8f9"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#67e8f9;stroke-width:4;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Expansion drops pressure and temperature</text><text x="70" y="142" class="s">The cooled refrigerant returns to the evaporator to absorb heat again.</text><rect x="110" y="300" width="260" height="220" rx="18" fill="#3a2c13" stroke="#fbbf24" stroke-width="3"/><text x="155" y="370">Liquid</text><text x="155" y="420" class="s">high pressure</text><path d="M370 410h120" class="f"/><rect x="510" y="330" width="180" height="160" rx="18" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><path d="M550 370h100M550 450h100" stroke="#67e8f9" stroke-width="5"/><path d="M560 370l80 80M640 370l-80 80" stroke="#67e8f9" stroke-width="3"/><text x="525" y="550">Expansion valve</text><path d="M690 410h130" class="f"/><rect x="840" y="300" width="250" height="220" rx="18" fill="#10273b" stroke="#67e8f9" stroke-width="3"/><text x="885" y="370">Cold mixture</text><text x="885" y="420" class="s">low pressure</text><path d="M1090 410v170H240v-60" class="f"/><text x="400" y="670" class="s">Back to the cold side: the loop repeats.</text></svg>
