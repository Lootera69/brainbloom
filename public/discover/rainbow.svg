<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A rainbow is viewing geometry</title><desc id="desc">With the Sun behind an observer and rain ahead, droplets send separated colours towards the observer at specific angles.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#fb7185"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">A rainbow depends on where you stand</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Sun behind you, raindrops ahead, and the right angle create the arc.</text><circle cx="170" cy="400" r="68" fill="#fbbf24"/><circle cx="600" cy="400" r="180" fill="#173c54" stroke="#7dd3fc" stroke-width="4"/><g fill="#7dd3fc"><circle cx="520" cy="330" r="12"/><circle cx="600" cy="400" r="12"/><circle cx="690" cy="335" r="12"/></g><path d="M245 400H500" stroke="#f8fafc" stroke-width="7" marker-end="url(#a)"/><path d="M520 330Q820 80 1080 350" fill="none" stroke="#fb7185" stroke-width="9"/><path d="M540 360Q820 180 1060 390" fill="none" stroke="#fbbf24" stroke-width="9"/><path d="M560 395Q820 260 1030 430" fill="none" stroke="#7dd3fc" stroke-width="9"/><path d="M820 560V440" stroke="#edf6ff" stroke-width="6" marker-end="url(#a)"/><text x="770" y="620" font-size="31">observer</text><text x="112" y="520" font-size="30" fill="#fbbf24">Sun</text><text x="500" y="660" font-size="29">sunlit rain</text><text x="600" y="750" text-anchor="middle" font-size="27" fill="#a9c3d8">There is no fixed endpoint: move, and your rainbow changes.</text></g></svg>
