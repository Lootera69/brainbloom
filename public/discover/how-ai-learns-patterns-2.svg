<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Weights adjust to reduce error</title><desc id="desc">A model compares its prediction with a target. An error signal nudges internal weights, improving the next prediction.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#fb7185"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#fb7185;stroke-width:3;marker-end:url(#a)}.n{fill:#152a43;stroke:#fb7185;stroke-width:3}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Learning is repeated correction</text><text x="70" y="142" class="s">Weights are numerical relationships, not a list of answers.</text><rect x="95" y="350" width="190" height="120" rx="16" class="n"/><text x="145" y="420">Input</text><path d="M285 410h95" class="f"/><circle cx="500" cy="410" r="115" class="n"/><text x="452" y="420">Weights</text><path d="M615 410h95" class="f"/><rect x="735" y="350" width="190" height="120" rx="16" class="n"/><text x="765" y="420">Prediction</text><path d="M830 485v110H500v-70" class="f"/><rect x="400" y="630" width="200" height="75" rx="16" fill="#3a1825" stroke="#fb7185" stroke-width="3"/><text x="450" y="680">Error signal</text><path d="M925 410h120" class="f"/><rect x="1045" y="350" width="85" height="120" rx="16" fill="#3a2c13" stroke="#fbbf24" stroke-width="3"/><text x="1060" y="420">Target</text><path d="M1045 455L600 650" class="f"/><text x="130" y="760" class="s">Many small updates across many examples change behaviour.</text></svg>
