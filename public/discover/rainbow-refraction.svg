<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Refraction separates sunlight in a raindrop</title><desc id="desc">White sunlight bends entering a raindrop, and different wavelengths bend by different amounts.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#f8fafc"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Bending begins at the drop's edge</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Refraction changes direction; dispersion gives each wavelength a slightly different path.</text><circle cx="650" cy="440" r="220" fill="#173c54" fill-opacity=".8" stroke="#7dd3fc" stroke-width="5"/><path d="M100 440H430" stroke="#f8fafc" stroke-width="12" marker-end="url(#a)"/><path d="M430 440L600 410" stroke="#f8fafc" stroke-width="8"/><path d="M600 410L980 270" stroke="#fb7185" stroke-width="8"/><path d="M600 410L1000 340" stroke="#fbbf24" stroke-width="8"/><path d="M600 410L1000 420" stroke="#7dd3fc" stroke-width="8"/><path d="M600 410L980 500" stroke="#8b5cf6" stroke-width="8"/><text x="140" y="370" font-size="31">white light</text><text x="920" y="250" font-size="27" fill="#fb7185">red</text><text x="940" y="330" font-size="27" fill="#fbbf24">yellow</text><text x="940" y="410" font-size="27" fill="#7dd3fc">blue</text><text x="920" y="535" font-size="27" fill="#8b5cf6">violet bends more</text><text x="600" y="750" text-anchor="middle" font-size="27" fill="#a9c3d8">The colours were in the sunlight already; the drop separates them.</text></g></svg>
