<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Eyes and lighting shape sky colour</title><desc id="desc">Human vision is more sensitive to some wavelengths in daylight, while at night there is little sunlight to scatter into a blue sky.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#a78bfa"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">Colour depends on light and eyes</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Daylight scattering and human sensitivity work together.</text><circle cx="275" cy="430" r="125" fill="#134b70" stroke="#7dd3fc" stroke-width="4"/><circle cx="275" cy="430" r="38" fill="#0b1b2c"/><path d="M275 305V275M170 370l-24-18M380 370l24-18" stroke="#7dd3fc" stroke-width="5"/><text x="180" y="620" font-size="31">daylight sky</text><path d="M450 430H600" stroke="#a78bfa" stroke-width="7" marker-end="url(#a)"/><path d="M760 300Q930 230 1060 370Q930 510 760 440Q690 370 760 300Z" fill="#173c54" stroke="#a78bfa" stroke-width="4"/><circle cx="870" cy="370" r="38" fill="#081522" stroke="#7dd3fc" stroke-width="4"/><text x="765" y="590" font-size="31">night: no sunlit sky</text><text x="600" y="735" text-anchor="middle" font-size="27" fill="#a9c3d8">Violet scatters strongly, but our daylight vision is especially responsive to blue-green light.</text></g></svg>
