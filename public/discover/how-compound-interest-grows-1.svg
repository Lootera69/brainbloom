<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Principal and rate set the first growth</title><desc id="desc">A principal balance multiplied by a percentage produces the interest for one period.</desc><defs><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#244258"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#34d399"/></marker></defs><rect width="1200" height="800" fill="#081522"/><rect width="1200" height="800" fill="url(#g)" opacity=".4"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="70" y="92" font-size="46" font-weight="700">A percentage starts the engine</text><text x="70" y="142" font-size="27" fill="#a9c3d8">Interest equals a rate applied to the balance for a chosen period.</text><rect x="120" y="330" width="260" height="190" rx="20" fill="#173c54" stroke="#7dd3fc" stroke-width="4"/><text x="250" y="410" text-anchor="middle" font-size="34">Principal</text><text x="250" y="465" text-anchor="middle" font-size="32" fill="#7dd3fc">$1,000</text><path d="M410 425H535" stroke="#34d399" stroke-width="7" marker-end="url(#a)"/><rect x="565" y="330" width="260" height="190" rx="20" fill="#173c54" stroke="#fbbf24" stroke-width="4"/><text x="695" y="410" text-anchor="middle" font-size="34">Rate</text><text x="695" y="465" text-anchor="middle" font-size="32" fill="#fbbf24">× 5%</text><path d="M855 425H980" stroke="#34d399" stroke-width="7" marker-end="url(#a)"/><rect x="1000" y="330" width="120" height="190" rx="20" fill="#173c54" stroke="#34d399" stroke-width="4"/><text x="1060" y="410" text-anchor="middle" font-size="28">$50</text><text x="1060" y="465" text-anchor="middle" font-size="25">interest</text><text x="600" y="670" text-anchor="middle" font-size="34" fill="#34d399">$1,000 + $50 = $1,050</text><text x="600" y="745" text-anchor="middle" font-size="26" fill="#a9c3d8">The next period uses the new balance.</text></g></svg>
