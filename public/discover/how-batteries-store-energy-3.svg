<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Charging drives chemistry in reverse</title><desc id="desc">A charger pushes electrons and ions in the reverse direction, restoring separated chemical states while each cycle causes some wear.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#34d399"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.f{fill:none;stroke:#34d399;stroke-width:4;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0H1200V800H0z"/><text x="70" y="95" class="h">Charging reverses the chemical path</text><text x="70" y="142" class="s">External energy pushes the cell toward its earlier state.</text><rect x="115" y="300" width="215" height="170" rx="18" fill="#152a43" stroke="#fbbf24" stroke-width="3"/><text x="169" y="373">Charger</text><path d="M245 470v65M205 535h80" stroke="#fbbf24" stroke-width="6"/><path d="M330 385h130" class="f"/><rect x="500" y="245" width="250" height="310" rx="22" fill="#10273b" stroke="#34d399" stroke-width="3"/><rect x="530" y="300" width="75" height="200" fill="#3a1825" stroke="#fb7185" stroke-width="2"/><rect x="645" y="300" width="75" height="200" fill="#123b35" stroke="#34d399" stroke-width="2"/><path d="M605 400h40" class="f"/><text x="558" y="600">Battery</text><path d="M790 385h130" class="f"/><circle cx="1020" cy="385" r="100" fill="#152a43" stroke="#67e8f9" stroke-width="3"/><text x="975" y="375">Stored</text><text x="970" y="415" class="s">energy</text><path d="M245 650h750" stroke="#23435b" stroke-width="14"/><path d="M260 650h600" stroke="#34d399" stroke-width="14"/><text x="365" y="735" class="s">Heat and cycling gradually reduce capacity.</text></svg>
