<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Opposite phase reduces sound</title><desc id="desc">A cancelling speaker emits a wave with opposite phase. When the waves overlap, their pressure changes partially cancel.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fb7185"/></pattern><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.w{fill:none;stroke-width:4}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".25" d="M0 0h1200v800H0z"/><text x="70" y="95" class="h">Opposite phase, smaller result</text><text x="70" y="142" class="s">Crests meet troughs and the pressure changes partly cancel.</text><path d="M100 300q30-110 60 0t60 0t60 0t60 0t60 0t60 0t60 0" class="w" stroke="#fb7185"/><text x="100" y="420">Noise wave</text><path d="M100 525q30 110 60 0t60 0t60 0t60 0t60 0t60 0t60 0" class="w" stroke="#a78bfa"/><text x="100" y="645">Opposite wave</text><path d="M550 300v225" stroke="#23435b" stroke-width="2"/><path d="M610 412q15-10 30 0t30 0t30 0t30 0t30 0" class="w" stroke="#34d399"/><text x="570" y="645">Result</text><path d="M830 412h210" stroke="#34d399" stroke-width="5"/><path d="M850 390h170M880 440h120" stroke="#34d399" stroke-width="3"/><text x="830" y="535" class="s">Lower pressure variation</text><rect x="140" y="700" width="900" height="55" rx="14" fill="#123b35" stroke="#34d399" stroke-width="2"/><text x="350" y="738">Destructive interference at the listening point</text></svg>
