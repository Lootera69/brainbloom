<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Blockchain links records into a shared history</title><desc id="desc">Transactions become blocks. Each block points to the previous block by its hash, while a network agrees on the next shared block.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23435b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a78bfa"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e2f2ff;font-size:30px}.h{font-size:44px;font-weight:700}.s{font-size:25px;fill:#93b8d0}.b{fill:#152a43;stroke:#a78bfa;stroke-width:3}.f{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#a)}</style></defs><path fill="#0b1325" d="M0 0h1200v800H0z"/><path fill="url(#g)" opacity=".45" d="M0 0h1200v800H0z"/><text x="70" y="95" class="h">A shared, linked record</text><text x="70" y="142" class="s">Batch records → fingerprint history → network agreement</text><rect x="95" y="305" width="220" height="245" rx="16" class="b"/><text x="130" y="360">Block 01</text><path d="M130 400h145M130 440h110M130 480h130" stroke="#67e8f9" stroke-width="8"/><text x="130" y="620" class="s">Records</text><path d="M320 425h90" class="f"/><rect x="420" y="305" width="220" height="245" rx="16" class="b"/><text x="455" y="360">Block 02</text><path d="M455 400h145M455 440h110M455 480h130" stroke="#67e8f9" stroke-width="8"/><text x="455" y="620" class="s">Previous hash</text><path d="M645 425h90" class="f"/><rect x="745" y="305" width="220" height="245" rx="16" class="b"/><text x="780" y="360">Block 03</text><path d="M780 400h145M780 440h110M780 480h130" stroke="#67e8f9" stroke-width="8"/><text x="780" y="620" class="s">Consensus</text><path d="M955 425h95" class="f"/><path d="M1065 320v210M1065 320l55 45M1065 385l55 45M1065 450l55 45" class="f"/><text x="1000" y="620" class="s">Copies</text><text x="280" y="730" class="s">Changing an old block changes every link after it.</text></svg>
